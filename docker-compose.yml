services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pathwise
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: pathwise_local
    ports: ["5433:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathwise -d pathwise"]
      interval: 5s
      retries: 10
  mongo:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  pg_data:
  mongo_data:
